<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シレン6 アイテム価格検索</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, "Meiryo", sans-serif; max-width: 1400px; margin: 0 auto; padding: 8px 10px 40px; background: #eeeef0; color: #222; }
  h1 { font-size: 1.1rem; margin: 4px 0; }
  #q { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 6px; margin-bottom: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .filters button { padding: 6px 16px; border-radius: 12px; border: 1px solid #c9b8e0; background: #f4edfa; color: #333; cursor: pointer; font-size: 1rem; }
  .filters button.active { background: #b784e0; border-color: #b784e0; color: #fff; }
  .states { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; font-size: 0.9rem; }
  .states label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; align-items: start; }
  .item { border: 1px solid #e0d3ee; border-radius: 6px; padding: 4px 6px; background: #fff; }
  .item h2 { margin: 0; font-size: 0.9rem; color: #000; }
  .item .meta { font-size: 0.7rem; opacity: 0.7; margin-bottom: 2px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78rem; }
  th, td { border: 1px solid #e3d8ef; padding: 1px 3px; text-align: right; line-height: 1.3; }
  th:first-child, td:first-child { text-align: center; }
  thead th { background: #e4cef2; color: #333; }
  .blessed { color: #1f9d55; }
  .cursed { color: #d84343; }
  #empty { opacity: 0.6; padding: 20px 0; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<h1>シレン6 アイテム価格検索</h1>
<input id="q" type="search" placeholder="アイテム名 または 値段で検索…">
<div class="states">
  <label><input type="checkbox" id="state-normal" checked> 通常</label>
  <label><input type="checkbox" id="state-cursed" checked> 呪い</label>
  <label><input type="checkbox" id="state-blessed" checked> 祝福</label>
</div>
<div class="filters" id="filters"></div>
<div id="results"></div>
<div id="empty" hidden>該当するアイテムがありません</div>

<script>
// 通常値からの倍率: 呪い=0.87倍(切り捨て), 祝福=2倍
function curse(n) { return Math.floor(n * 0.87); }
function bless(n) { return n * 2; }

const LV_SIMPLE = ["-"];
const LV_WAND = ["未鑑定","+0","+1","+2","+3","+4","+5","+6","+7"];
const LV_JAR = ["未鑑定","+0","+1","+2","+3","+4","+5","+6"];

function simple(cat, entries) {
  return entries.map(([name, buy, sell]) => ({ name, cat, count: null, labels: LV_SIMPLE, prices: [[buy, sell]] }));
}
function withLevels(cat, labels, prices, entries) {
  return entries.map(([name, count]) => ({ name, cat, count, labels, prices }));
}

const items = [
  ...simple("巻物", [
    ["ぬれた巻物",200,80],["混乱の巻物",300,120],["バクスイの巻物",300,120],["ゾワゾワの巻物",300,120],
    ["真空斬りの巻物",300,120],["識別の巻物",300,120],["銀封印の巻物",300,120],["生物集合の巻物",300,120],
    ["道具寄せの巻物",300,120],["困った時の巻物",300,120],["天の恵みの巻物",400,160],["地の恵みの巻物",400,160],
    ["メッキの巻物",400,160],["印増大の巻物",400,160],["印消しの巻物",400,160],["おにぎりの巻物",400,160],
    ["おはらいの巻物",600,240],["あかりの巻物",600,240],["迷子の巻物",600,240],["罠消しの巻物",600,240],
    ["銀はがしの巻物",1000,400],["壺増大の巻物",1000,400],["吸い出しの巻物",1000,400],["呪いの巻物",1000,400],
    ["罠の巻物",1000,400],["水がれの巻物",1000,400],["魔物部屋の巻物",1000,400],["大部屋の巻物",1000,400],
    ["バクチの巻物",1000,400],["くちなしの巻物",1000,400],["拾えずの巻物",1000,400],["敵加速の巻物",1000,400],
    ["脱出の巻物",1000,400],["聖域の巻物",1000,400],["白紙の巻物",1000,400],["全滅の巻物",3000,1200],
    ["ねだやしの巻物",10000,4000],
  ]),
  ...simple("草・種", [
    ["雑草",10,4],["薬草",40,10],["毒草",50,20],["暴走の種",50,20],["混乱草",70,25],["睡眠草",70,25],
    ["目つぶし草",70,25],["めぐすり草",70,25],["すばやさ草",70,25],["パワーアップ草",70,25],["弟切草",80,30],
    ["高飛び草",100,40],["くねくね草",100,40],["いやし草",200,80],["かぐわし草",200,80],["胃拡張の種",200,80],
    ["胃縮小の種",200,80],["ドラゴン草",250,100],["復活の草",400,160],["無敵草",400,160],["不幸の種",400,160],
    ["命の草",500,200],["毒消し草",600,240],["ちからの草",700,280],["しあわせ草",1000,400],
    ["天使の種",2000,800],["超不幸の種",2000,800],
  ]),
  ...simple("腕輪", [
    ["遠投の腕輪",1500,600],["ヘタ投げの腕輪",1500,600],["ボヨヨンの腕輪",1500,600],["連射の腕輪",1500,600],
    ["諸刃の腕輪",1500,600],["痛恨の腕輪",1500,600],["高飛びの腕輪",1500,600],["爆発の腕輪",1500,600],
    ["垂れ流しの腕輪",1500,600],["金垂れ流しの腕輪",1500,600],["罠増しの腕輪",1500,600],
    ["ちからの腕輪",2000,800],
    ["睡眠よけの腕輪",2500,1000],["気配察知の腕輪",2500,1000],["道具感知の腕輪",2500,1000],["大砲強化の腕輪",2500,1000],
    ["呪いよけの腕輪",3000,1200],["水グモの腕輪",3000,1200],["浮遊の腕輪",3000,1200],["魔物呼びの腕輪",3000,1200],
    ["胃拡張の腕輪",3500,1400],["胃縮小の腕輪",3500,1400],["弾きよけの腕輪",3500,1400],["値切りの腕輪",3500,1400],
    ["しあわせの腕輪",4000,1600],["混乱よけの腕輪",4000,1600],
    ["回復の腕輪",5000,2000],["錆よけの腕輪",5000,2000],["透視の腕輪",5000,2000],["裏道の腕輪",5000,2000],["すれちがいの腕輪",5000,2000],
    ["毒消しの腕輪",6500,2600],["壁抜けの腕輪",6500,2600],["忍び足の腕輪",6500,2600],
    ["罠師の腕輪",7500,3000],["鑑定師の腕輪",7500,3000],
    ["百発百中の腕輪",15000,6000],
  ]),
  ...withLevels("杖", LV_WAND, [[100,40],[500,200],[600,240],[700,280],[800,320],[900,360],[1000,400],[1100,440],[1200,480]], [
    ["ただの杖","5～7"],["吹き飛ばしの杖","5～7"],["場所がえの杖","5～7"],["飛びつきの杖","5～7"],["転ばぬ先の杖","5～7"],
    ["かなしばりの杖","4～6"],["封印の杖","4～6"],["感電の杖","4～6"],
  ]),
  ...withLevels("杖", LV_WAND, [[100,40],[700,280],[800,320],[900,360],[1000,400],[1100,440],[1200,480],[1300,520],[1400,560]], [
    ["トンネルの杖","4～6"],["土塊の杖","4～6"],["鈍足の杖","4～6"],["加速の杖","4～6"],["導きの杖","2～4"],
  ]),
  ...withLevels("杖", LV_WAND, [[100,40],[1000,400],[1100,440],[1200,480],[1300,520],[1400,560],[1500,600],[1600,640],[1700,680]], [
    ["痛み分けの杖","5～7"],["ガイコツまどうの杖","5～7"],["一時しのぎの杖","4～6"],["幸せの杖","4～6"],["不幸の杖","4～6"],
  ]),
  ...withLevels("杖", LV_WAND, [[100,40],[2000,800],[2100,840],[2200,880],[2300,920],[2400,960],[2500,1000],[2600,1040],[2700,1080]], [
    ["身代わりの杖","4～6"],["桃まんの杖","4～6"],
  ]),
  ...withLevels("壺", LV_JAR, [[100,40],[800,320],[900,360],[1000,400],[1100,440],[1200,480],[1300,520],[1400,560]], [
    ["保存の壺","3～5"],["識別の壺","3～5"],["変化の壺","3～5"],["ただの壺","3～5"],["やりすごしの壺","3～5"],
  ]),
  ...withLevels("壺", LV_JAR, [[100,40],[1000,400],[1100,440],[1200,480],[1300,520],[1400,560],[1500,600],[1600,640]], [
    ["換金の壺","3～5"],["手封じの壺","3～5"],["割れない壺","3～5"],["倉庫の壺","2～5"],["底抜けの壺","2～4"],
  ]),
  ...withLevels("壺", LV_JAR, [[100,40],[1600,640],[1700,680],[1800,720],[1900,760],[2000,800],[2100,840],[2200,880]], [
    ["おはらいの壺","2～4"],["呪いの壺","2～4"],
  ]),
  ...withLevels("壺", LV_JAR, [[100,40],[2000,800],[2100,840],[2200,880],[2300,920],[2400,960],[2500,1000],[2600,1040]], [
    ["背中の壺","3～5"],["トドの壺","3～5"],["水鉄砲の壺","3～5"],["魔物の壺","3～5"],["ビックリの壺","3～5"],["笑いの壺","2～3"],
  ]),
  ...withLevels("壺", LV_JAR, [[100,40],[6000,2400],[6100,2440],[6200,2480],[6300,2520],[6400,2560],[6500,2600],[6600,2640]], [
    ["合成の壺","3～4"],
  ]),
  ...withLevels("壺", LV_JAR, [[100,40],[10000,4000],[10100,4040],[10200,4080],[10300,4120],[10400,4160],[10500,4200],[10600,4240]], [
    ["強化の壺","2～3"],["弱化の壺","2～3"],
  ]),
];

const categories = ["すべて","巻物","草・種","腕輪","杖","壺"];
let activeCat = "すべて";

const filtersEl = document.getElementById("filters");
categories.forEach(cat => {
  const btn = document.createElement("button");
  btn.textContent = cat;
  if (cat === activeCat) btn.classList.add("active");
  btn.onclick = () => { activeCat = cat; render(); [...filtersEl.children].forEach(b => b.classList.toggle("active", b.textContent === cat)); };
  filtersEl.appendChild(btn);
});

function renderItem(item) {
  const rows = item.labels.map((label, i) => {
    const [buy, sell] = item.prices[i];
    return `<tr>
      <th>${label}</th>
      <td>${buy}/${sell}</td>
      <td class="cursed">${curse(buy)}/${curse(sell)}</td>
      <td class="blessed">${bless(buy)}/${bless(sell)}</td>
    </tr>`;
  }).join("");
  const meta = item.count ? `${item.cat} / 個数: ${item.count}` : item.cat;
  return `<div class="item">
    <h2>${item.name}</h2>
    <div class="meta">${meta}</div>
    <table>
      <thead><tr><th></th><th>通常</th><th>呪い</th><th>祝福</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// 値段検索: チェックされた状態(通常/呪い/祝福)の買値/売値のいずれかに一致するか
function priceMatches(item, price, states) {
  return item.prices.some(([buy, sell]) => {
    const candidates = [];
    if (states.normal) candidates.push(buy, sell);
    if (states.cursed) candidates.push(curse(buy), curse(sell));
    if (states.blessed) candidates.push(bless(buy), bless(sell));
    return candidates.includes(price);
  });
}

function render() {
  const q = document.getElementById("q").value.trim();
  const priceQuery = /^\d+$/.test(q) ? Number(q) : null;
  const states = {
    normal: document.getElementById("state-normal").checked,
    cursed: document.getElementById("state-cursed").checked,
    blessed: document.getElementById("state-blessed").checked,
  };
  const resultsEl = document.getElementById("results");
  const emptyEl = document.getElementById("empty");
  const matched = items.filter(it =>
    (activeCat === "すべて" || it.cat === activeCat) &&
    (q === "" || it.name.includes(q) || (priceQuery !== null && priceMatches(it, priceQuery, states)))
  );
  resultsEl.innerHTML = matched.map(renderItem).join("");
  emptyEl.hidden = matched.length > 0;
}

document.getElementById("q").addEventListener("input", render);
["state-normal","state-cursed","state-blessed"].forEach(id =>
  document.getElementById(id).addEventListener("change", render)
);
render();
</script>
</body>
</html>
